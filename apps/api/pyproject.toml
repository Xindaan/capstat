[project]
name = "capstat-api"
version = "0.3.1" # x-release-please-version
description = "FastAPI service wrapping capstat-core: stateless SPC/capability compute + CSV/XLSX ingestion."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "André Leopold" }]

dependencies = [
    "capstat-core",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    # Ingestion only. Deliberately confined to this package: capstat-core
    # stays numpy+scipy only (PLAN.md non-negotiable).
    "pandas>=3.0.5",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
# The local CLI (T-0077). It lives here rather than in a package of its own
# because it needs exactly what this package already owns: the tabular parsing,
# in one implementation shared with /ingest.
capstat = "capstat_api.cli:main"

[project.urls]
Homepage = "https://github.com/Xindaan/capstat"
Repository = "https://github.com/Xindaan/capstat"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/capstat_api"]
