[project]
name = "capstat-api"
version = "0.1.0" # x-release-please-version
description = "FastAPI service wrapping capstat-core: stateless SPC/capability compute + CSV/XLSX ingestion."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "André Leopold" }]

dependencies = [
    "capstat-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Ingestion only. Deliberately confined to this package: capstat-core
    # stays numpy+scipy only (PLAN.md non-negotiable).
    "pandas>=2.2",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/Xindaan/capstat"
Repository = "https://github.com/Xindaan/capstat"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/capstat_api"]
