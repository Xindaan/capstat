name: publish

# Manual only. This workflow has NO push/release/tag trigger, so merging it
# changes nothing: nothing is published until someone deliberately runs it from
# the Actions tab. Even then it stops at the `pypi` environment's required
# reviewer before the upload -- a second, human gate.
#
# It uploads over PyPI trusted publishing (OIDC), so no API token is created,
# stored, or rotated. The trusted publisher on PyPI is configured for this exact
# repo, this workflow filename (publish.yml), and this environment (pypi); all
# three must match or the upload is refused rather than misdirected.
#
# After the upload it verifies what PyPI now serves against that same tag, file
# by file (scripts/verify_pypi_release.py). A green upload only says PyPI
# accepted something; 0.3.1 added no public symbol, so importing the result
# could not have told it apart from 0.3.0. That comparison was done by hand for
# 0.3.1 -- the script is that check, so it happens on every release instead of
# when someone remembers.
#
# It publishes a TAG, never a branch. Until 2026-08-16 this checked out whatever
# `main` held while the version string came from pyproject.toml -- which only
# moves when release-please cuts a release. Whenever main ran ahead of the newest
# tag those two disagreed, and on 2026-08-16 they had drifted 20 commits apart:
# running it then would have published a permanent `0.1.0` containing 0.2.0's
# code. PyPI never lets a version number be reused, not even after a yank.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.2.0 (must already exist)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: build and publish capstat-core to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/capstat-core/
    permissions:
      id-token: write # required for trusted publishing; nothing else
    steps:
      # The tag, not the branch. A tag that does not exist fails here, which is
      # the intended outcome: a typo must not silently fall back to a default.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Install uv
        # v7, not v8 -- see the note in ci.yml: v8 dropped the workflow that
        # maintains the moving major tag, so there is no `v8` ref to resolve.
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Build capstat-core (sdist + wheel)
        run: |
          rm -rf dist
          uv build --package capstat-core

      # A wrong version is the one mistake trusted publishing cannot catch, and
      # PyPI uploads are permanent. The anchor is the TAG NAME: it comes from
      # outside the checked-out tree, so it can disagree with the package. The
      # older form of this step compared dist/ against capstat_core.__version__
      # -- both read from the same tree, so they agreed even when both were wrong
      # for the release being cut. That checked consistency, not correctness.
      #
      # `tag` goes through env rather than into the script body: interpolating a
      # workflow input directly into `run:` lets its contents be executed.
      - name: Verify the built version matches the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          expected="${TAG#v}"
          version="$(uv run --package capstat-core python -c 'import capstat_core; print(capstat_core.__version__)')"
          echo "tag: ${TAG} -> expected version: ${expected}"
          echo "package version: ${version}"
          test "${version}" = "${expected}" \
            || { echo "::error::tag ${TAG} expects ${expected}, package says ${version}"; exit 1; }
          test -f "dist/capstat_core-${expected}.tar.gz" \
            || { echo "::error::no sdist for ${expected} in dist/"; ls -la dist; exit 1; }
          test -f "dist/capstat_core-${expected}-py3-none-any.whl" \
            || { echo "::error::no wheel for ${expected} in dist/"; ls -la dist; exit 1; }

      # uv.lock carries the version too, and nothing else in the repo keeps it
      # honest: release-please does not touch it, and `uv sync --frozen` takes
      # it as it finds it. On 2026-09-19 it still said 0.3.0 while the packages,
      # the tag and PyPI had all moved to 0.3.1 (T-0087). A stale lock does not
      # change what gets uploaded -- the wheel is built from the tree -- but it
      # is a file that carries the version disagreeing with the release, and
      # AGENTS.md requires the tag to stamp every one of them.
      - name: Verify uv.lock stamps the tag's version
        env:
          TAG: ${{ inputs.tag }}
        run: uv run --no-project python scripts/check_lock_version.py "${TAG}"

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

      # The one check that reads PyPI rather than this runner: a fresh
      # environment installs the version from pypi.org, and every installed
      # source file is compared byte for byte against the tag. It fails the job
      # if they differ. The upload cannot be undone at that point -- knowing is
      # still the difference between a yank and a surprise months later.
      #
      # `--no-project` because the script is stdlib-only: it needs an
      # interpreter, not the workspace's dependencies.
      #
      # PyPI accepts an upload before it serves it, and this step starts about a
      # second after the previous one finishes. On 0.4.1 that was enough to fail
      # a perfectly good release: the wheel landed at 18:51:17, this step asked
      # at 18:51:19 and was told there is no such version. The script now waits
      # for the simple index -- the page a resolver actually reads -- before it
      # installs (T-0093). The retry budget is raised over the script's default
      # of 5x15s because the cost of waiting is a slow release, while the cost
      # of giving up early is a red run on a healthy one, which is how a check
      # stops being read. A version that is genuinely absent still fails, just
      # later.
      - name: Verify the published artefact against the tag
        env:
          TAG: ${{ inputs.tag }}
        run: >-
          uv run --no-project python scripts/verify_pypi_release.py "${TAG}"
          --retries 10 --delay 15
