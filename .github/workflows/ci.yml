name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Pinned to the v7 major, not v8: setup-uv v8 removed the workflow that
        # maintains the moving major tag, so there is no `v8` ref to resolve --
        # only full versions. v7 is Node-24 native and keeps the floating tag.
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: OpenAPI schema drift
        run: uv run python -m capstat_api.export_openapi --check

      - name: Pytest with coverage
        run: uv run pytest --cov=capstat_core --cov=capstat_api --cov-report=term-missing

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The committed TS client must match the committed OpenAPI schema. The
      # Python job already guards openapi.json against the code; this guards
      # the generated types against openapi.json.
      - name: TS client drift
        run: npm run check:api

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build (also type-checks)
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke test (Playwright)
        run: npm run test:e2e
