name: Feature request
description: Suggest a method or capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do that capstat cannot do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: >
        For a statistical method, name the authoritative reference it should
        be validated against.
    validations:
      required: true
