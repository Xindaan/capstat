# Workspace root for capstat. This project is not published; it exists to
# hold the uv workspace, the shared dev toolchain, and repo-wide tool config.
# The publishable library lives in packages/capstat-core.
[project]
name = "capstat-workspace"
version = "0.0.0"
description = "Workspace root for capstat (not published)."
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
capstat-core = { workspace = true }

[dependency-groups]
dev = [
    "capstat-core",
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.13",
    "ruff>=0.8",
    "pre-commit>=4",
]

# ---------------------------------------------------------------------------
# Shared tool configuration (applies repo-wide).
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["apps/web"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # flake8-bugbear
    "SIM",           # flake8-simplify
    "RUF",           # ruff-specific
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
files = ["packages/capstat-core/src", "packages/capstat-core/tests"]

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages/capstat-core/tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["capstat_core"]

[tool.coverage.report]
show_missing = true
fail_under = 95
