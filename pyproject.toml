# Workspace root for capstat. This project is not published; it exists to
# hold the uv workspace, the shared dev toolchain, and repo-wide tool config.
# The publishable library lives in packages/capstat-core.
[project]
name = "capstat-workspace"
version = "0.0.0"
description = "Workspace root for capstat (not published)."
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/*"]
# apps/web is a Node/Next.js package, not a Python one; without this exclude the
# apps/* glob claims it as a workspace member and uv fails on the missing
# pyproject.toml.
exclude = ["apps/web"]

[tool.uv.sources]
capstat-core = { workspace = true }
capstat-api = { workspace = true }

[dependency-groups]
dev = [
    "capstat-core",
    "capstat-api",
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=2.3.1",
    "ruff>=0.16.0",
    "pre-commit>=4.6.2",
    # Test-only: parses the reference-value YAML. Deliberately NOT a core
    # dependency -- capstat-core ships with numpy + scipy and nothing else.
    "pyyaml>=6",
    "types-pyyaml>=6.0.12.20260815",
    # Test-only: FastAPI's TestClient rides on httpx. starlette 1.3 deprecates
    # the httpx backend in favour of httpx2; both are listed while the
    # transition is in flight -- TestClient picks httpx2 when it is importable.
    "httpx>=0.27",
    "httpx2>=2.10.0",
]

# Docs are a separate group: building the site should not drag mkdocs into
# every CI job that only wants to run tests.
docs = [
    "capstat-core",
    "capstat-api",
    # Ceiling on purpose (T-0029): MkDocs 2.0 removes the plugin system with
    # "no migration path" and rewrites theming, which would take mkdocstrings
    # and the Material theme out together. The committed uv.lock already holds
    # 1.6.x, but a lock refresh would happily cross a major version -- and the
    # break would surface while working on something unrelated. Raise this
    # deliberately, after checking that both plugins support 2.x.
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=1.0.6",
    "pyyaml>=6",
]

# ---------------------------------------------------------------------------
# Shared tool configuration (applies repo-wide).
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["apps/web"]

# Ruff 0.16 began formatting Python code blocks inside Markdown. For prose that
# is a regression, not an improvement: the snippets in README.md and docs/ align
# their trailing comments into columns so a reader can scan value against
# explanation, and the formatter collapses that to a single space. Worse, it
# reads a wrapped comment as a new statement, so
#     mad(measurements)                 # ~0.2965 -- a sigma estimate, scaled for
#                                       # normal data, vs. std_dev's 5.2717
# loses its indentation and the continuation turns into a top-level comment.
# The documentation is written for people, and these blocks are illustrations
# rather than code that has to compile -- so the formatter does not own them.
# Linting still covers them; only formatting is excluded.
[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # flake8-bugbear
    "SIM",           # flake8-simplify
    "RUF",           # ruff-specific
]

[tool.mypy]
# Deliberately no `python_version`: mypy then targets whichever interpreter it
# runs under, which is what we want across the CI matrix. Pinning it to the
# 3.11 floor breaks on 3.12+, where numpy's stubs use PEP 695 `type` statements
# that mypy only parses when the target version is >= 3.12.
strict = true
warn_unused_configs = true
files = [
    "packages/capstat-core/src",
    "packages/capstat-core/tests",
    "apps/api/src",
    "apps/api/tests",
    # Build tooling runs in CI, so it is held to the same standard as the code
    # it generates from.
    "scripts",
]

[[tool.mypy.overrides]]
module = ["scipy.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages/capstat-core/tests", "apps/api/tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["capstat_core", "capstat_api"]

[tool.coverage.report]
show_missing = true
fail_under = 95
