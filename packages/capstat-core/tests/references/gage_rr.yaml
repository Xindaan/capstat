# Gage R&R (ANOVA method) -- reference values
#
# ---------------------------------------------------------------------------
# The worked example is SPC for Excel's ANOVA Gage R&R series, which applies
# the AIAG MSA-4 ANOVA method to a 5-part x 3-operator x 3-trial study. It is a
# deliberately good test case because it exercises the two hardest paths at
# once:
#   * the part*operator interaction is NOT significant (F = 0.142, p = 0.9964),
#     so it is dropped and pooled back into repeatability before the variance
#     components are re-estimated; and
#   * the full-model interaction variance is negative (-0.0163), the exact
#     situation the negative-variance clamp exists for.
#
# Per the project rule (validate against a source that did not produce the
# value), the published ANOVA table and every variance component were also
# recomputed independently from the raw data with a plain-numpy two-way ANOVA
# before being written here; both agree to the printed precision. Tolerances are
# therefore set by the precision of the *published* numbers, not our own.

sources:
  anova_method:
    title: >
      AIAG. Measurement Systems Analysis (MSA), 4th ed., 2010, ch. III sec. B
      (Gage R&R -- ANOVA method).
  worked_example:
    title: "SPC for Excel: ANOVA Gage R&R (Part 3)"
    url: https://www.spcforexcel.com/knowledge/measurement-systems-analysis-gage-rr/anova-gage-rr-part-3/
    retrieved: 2026-07-15
    note: >
      5 parts, 3 operators, 3 trials. Interaction not significant (p = 0.9964),
      so the ANOVA is re-run without it and the components pooled.
  duncan_d2_star:
    title: >
      Duncan, A. J. Quality Control and Industrial Statistics, 5th ed.,
      Table D3 (d2* factors); reproduced in the AIAG MSA manual appendix.
    note: >
      capstat computes d2*(n, g) = sqrt(d2(n)^2 + d3(n)^2 / g) from its own d2/d3
      rather than copying the table. The AIAG K2 and K3 constants are 1 / d2*(.,
      1): K2(2 operators) = 1/1.4142 = 0.7071, K3(10 parts) = 1/3.179 = 0.3146.
  average_range_10part:
    title: "SPC for Excel: Three Methods to Analyze Gage R&R Studies"
    url: https://www.spcforexcel.com/knowledge/measurement-systems-analysis-gage-rr/three-methods-analyze-gage-rr-studies/
    retrieved: 2026-07-15
    note: >
      The canonical AIAG 10-part x 3-operator x 3-trial average-and-range
      example. Summary ranges Rbar = 0.342, X_diff = 0.445, Rp = 3.511 give
      EV = 0.202, AV = 0.230, PV = 1.104, GRR = 0.306, TV = 1.146, %GRR = 26.68.

cases:
  - id: spc-anova-gage-rr-pooled
    method: gage_rr
    description: >
      The full AIAG ANOVA method with a dropped (pooled) interaction and a
      clamped-negative interaction variance. Pins the pooling decision, the
      variance-component estimators, both percentage conventions, and ndc.
    input:
      # (parts x operators x trials)
      data:
        - [[3.29, 3.41, 3.64], [3.08, 3.25, 3.07], [3.04, 2.89, 2.85]]
        - [[2.44, 2.32, 2.42], [2.53, 1.78, 2.32], [1.62, 1.87, 2.04]]
        - [[4.34, 4.17, 4.27], [4.19, 3.94, 4.34], [3.88, 4.09, 3.67]]
        - [[3.47, 3.50, 3.64], [3.01, 4.03, 3.20], [3.14, 3.20, 3.11]]
        - [[2.20, 2.08, 2.16], [2.44, 1.80, 1.72], [1.54, 1.93, 1.55]]
    expected:
      interaction_included: false
      interaction_pvalue: 0.9964
      var_repeatability: 0.0468
      var_operator: 0.0512
      var_interaction: 0.0
      var_part: 0.7978
      var_gage_rr: 0.0980
      var_total: 0.8958
      pct_contribution_gage_rr: 10.94
      pct_contribution_repeatability: 5.22
      pct_contribution_reproducibility: 5.72
      pct_contribution_part: 89.06
      pct_study_var_gage_rr: 33.07
      pct_study_var_repeatability: 22.85
      pct_study_var_reproducibility: 23.91
      pct_study_var_part: 94.37
      ndc: 4
    tolerance:
      var: 5.0e-4
      pct: 0.01
      pvalue: 5.0e-4

  # d2*(n, 1): computed from d2/d3, checked against Duncan's published table.
  - id: d2-star-duncan-table
    method: d2_star
    description: >
      d2* for a single range (g = 1), the case the average-and-range method
      leans on. Printed to two decimals in the table, so the tolerance is set by
      the table, not by our computation.
    expected:
      2: 1.41
      3: 1.91
      4: 2.24
      5: 2.48
      6: 2.67
      7: 2.83
      8: 2.96
      9: 3.08
      10: 3.18
    tolerance:
      abs: 5.0e-3

  # The published AIAG 10-part average-and-range worked example, pinned at the
  # summary-range level (we do not have its 90 raw values). This checks the
  # constants (d2, d2*) and the EV/AV/PV/GRR formulas against AIAG's own numbers.
  - id: average-range-aiag-10part-summary
    method: gage_rr_range_from_ranges
    description: >
      Rbar, X_diff and Rp from AIAG's 10x3x3 example -> EV, AV, PV, GRR, %GRR.
    input:
      rbar_bar: 0.342
      x_diff: 0.445
      range_parts: 3.511
      parts: 10
      operators: 3
      trials: 3
    expected:
      ev: 0.202
      av: 0.230
      pv: 1.104
      gage_rr: 0.306
      total: 1.146
      pct_study_var_gage_rr: 26.68
    tolerance:
      sd: 1.0e-3
      pct: 0.05
