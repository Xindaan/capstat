# Normality tests -- reference values
#
# ---------------------------------------------------------------------------
# Why these sources
# ---------------------------------------------------------------------------
# scipy provides the Anderson-Darling *statistic* and Stephens' *critical
# values*, but no p-value. capstat supplies the p-value, which is the one part
# of this module that is genuinely ours -- and therefore the one part where a
# mis-transcribed coefficient would slip through unnoticed. It is validated
# from two directions that do not share a source:
#
#   1. The four-branch approximation is transcribed verbatim from the canonical
#      R implementation (CRAN `nortest` 1.0-4, `ad.test`, Juergen Gross), which
#      implements D'Agostino & Stephens (1986).
#   2. Evaluating that approximation at Stephens' *independently published*
#      critical values must return the nominal significance levels. It does, to
#      within 2 % -- see the `ad-pvalue-calibration` case. The two sources agree
#      without ever having been derived from one another here.
#
# The 5 % critical value 0.752 is additionally confirmed by the NIST/SEMATECH
# e-Handbook (section 1.3.5.14), which states "Critical value: 0.752" for
# alpha = 0.05 -- matching scipy's table entry exactly.
#
# Shapiro-Wilk is delegated to scipy's AS R94 (Royston 1995) implementation, the
# same algorithm R's shapiro.test uses. Testing scipy against scipy would be
# circular, so it is validated against a *published* R result instead.

sources:
  anderson_darling_statistic:
    title: >
      Anderson, T. W., & Darling, D. A. (1954). A test of goodness of fit.
      Journal of the American Statistical Association, 49(268), 765-769.
    note: >
      Statistic cross-validated against scipy.stats.anderson, an independent
      implementation, on all nine NIST StRD univariate datasets (see
      test_normality.py).
  anderson_darling_pvalue:
    title: >
      D'Agostino, R. B., & Stephens, M. A. (1986). Goodness-of-Fit Techniques.
      Marcel Dekker.
    implementation: CRAN nortest 1.0-4, ad.test() -- transcribed verbatim
    url: https://cran.r-project.org/package=nortest
    retrieved: 2026-07-14
  anderson_darling_critical_values:
    title: >
      Stephens, M. A. (1974). EDF statistics for goodness of fit and some
      comparisons. JASA, 69(347), 730-737.
    corroboration: >
      NIST/SEMATECH e-Handbook of Statistical Methods, section 1.3.5.14, states
      the alpha = 0.05 critical value as 0.752.
    url: https://www.itl.nist.gov/div898/handbook/eda/section3/eda35e.htm
  shapiro_wilk:
    title: >
      Royston, P. (1995). Remark AS R94: A remark on Algorithm AS 181: The W
      test for normality. Applied Statistics, 44(4), 547-551.
    published_example: >
      StatsRef (statsref.com/HTML/shapiro-wilk.html), worked example on Shapiro
      & Wilk's original data, evaluated with R's shapiro.test().
    retrieved: 2026-07-14
  grouped_normal_fit:
    title: >
      NIST/SEMATECH e-Handbook of Statistical Methods, section 1.3.5.15,
      Chi-Square Goodness-of-Fit Test.
    url: https://www.itl.nist.gov/div898/handbook/eda/section3/eda35f.htm
    retrieved: 2026-10-21
    formula: >
      l(theta) = sum_i O_i * log(F_theta(y_{i+1}) - F_theta(y_i)), maximised
      over theta: "the maximum likelihood estimate derived from the observed
      bin counts, not from the individual observations". capstat applies it to
      readings rounded to a gauge step r, whose bins are [v - r/2, v + r/2].
  sheppard_correction:
    title: >
      Sheppard, W. F. (1898). On the calculation of the most probable values
      of frequency-constants, for data arranged according to equidistant
      division of a scale. Proceedings of the London Mathematical Society, 29,
      353-380.
    note: >
      Sheppard's correction, sigma^2 = s^2 - r^2/12, is the classical
      large-sample approximation to the binned estimate on a fine grid; it is
      the independent cross-check of capstat's binned fit (case
      grouped-fit-matches-sheppard).
  resolution_calibration:
    title: >
      Davison, A. C., & Hinkley, D. V. (1997). Bootstrap Methods and their
      Application. Cambridge University Press, chapter 4.
    note: >
      Parametric bootstrap (Monte Carlo) test: the null distribution of the
      unchanged Anderson-Darling and Shapiro-Wilk statistics is simulated from
      the fitted normal, rounded to the readings' grid. capstat has no published worked
      example for this combination; it is validated by its size on
      simulated rounded normal data (case resolution-calibrated-size), not by
      a quoted number.

cases:
  # -------------------------------------------------------------------------
  # Shapiro-Wilk against a published R shapiro.test() result.
  # -------------------------------------------------------------------------
  - id: shapiro-wilk-published-r-value
    method: shapiro_wilk
    description: >
      Shapiro & Wilk's original example data. R's shapiro.test() reports
      W = 0.7888 and p-value = 0.006704; the published values are quoted to
      four significant figures, so the tolerance is set accordingly.
    input: [148, 154, 158, 160, 161, 162, 166, 170, 182, 195, 236]
    expected:
      statistic: 0.7888
      p_value: 0.006704
    tolerance:
      abs: 5.0e-5

  # -------------------------------------------------------------------------
  # Anderson-Darling p-value calibration.
  #
  # Stephens' critical values for the adjusted statistic A*^2, and the nominal
  # significance levels they correspond to. Feeding each critical value into
  # our p-value approximation must return its own alpha back. The two sides of
  # this table come from different publications; agreement is meaningful.
  # -------------------------------------------------------------------------
  - id: ad-pvalue-calibration
    method: anderson_darling_pvalue
    description: >
      Round-trip check: p_value(A*^2 = critical value at alpha) == alpha.
      The approximation is not exact, hence the 2.5 % relative tolerance; the
      worst observed deviation is 2.0 % (at alpha = 0.15).
    input:
      adjusted_statistic: [0.561, 0.631, 0.752, 0.873, 1.035]
    expected:
      alpha: [0.15, 0.10, 0.05, 0.025, 0.01]
    tolerance:
      rel: 0.025

  # -------------------------------------------------------------------------
  # Anderson-Darling p-value: the branch boundaries of the approximation.
  # A discontinuity here would mean a mis-transcribed coefficient.
  # -------------------------------------------------------------------------
  - id: ad-pvalue-branch-continuity
    method: anderson_darling_pvalue
    description: >
      The four branches must very nearly agree where they meet. They do not
      agree exactly: D'Agostino & Stephens fitted each branch separately, so
      the piecewise function has small genuine discontinuities. Measured gaps:

        A*^2 = 0.20  ->  1.0e-04   (branch 1 | branch 2)
        A*^2 = 0.34  ->  3.3e-03   (branch 2 | branch 3)
        A*^2 = 0.60  ->  2.5e-03   (branch 3 | branch 4)

      These are properties of the published approximation, not transcription
      errors. The test pins them at 5e-3: any mistyped coefficient would blow
      a boundary open far wider than that, while the real jumps stay under it.
    input:
      boundaries: [0.2, 0.34, 0.6]
    tolerance:
      abs: 5.0e-3

  # -------------------------------------------------------------------------
  # Readings rounded to a gauge resolution (T-0097, CAP-6).
  # -------------------------------------------------------------------------
  - id: grouped-fit-matches-sheppard
    method: grouped_normal_fit
    description: >
      N(10, 0.05), n = 20000, rounded to a step of one sigma (0.05). The raw
      standard deviation of the rounded readings is inflated by the rounding
      (sqrt(1 + 1/12) = 1.041 times sigma). The binned maximum-likelihood
      sigma must remove that inflation: it agrees with Sheppard's corrected
      value sqrt(s^2 - r^2/12) to 4e-4 relative on seeds 0-2 (measured
      2026-10-21), while the raw sd is 4 % high. At a step of two sigma,
      where Sheppard's large-sample approximation no longer holds (it gives
      1.5-2.3 % too little), the binned estimate still lands within 0.6 % of
      the unrounded sample's sd.
    input:
      n: 20000
      sigma: 0.05
      steps: [0.05, 0.1]
    tolerance:
      sheppard_rel: 2.0e-3       # step = 1 sigma
      unrounded_rel: 1.5e-2      # step = 2 sigma, against the unrounded sd

  - id: resolution-calibrated-size
    method: resolution_calibration
    description: >
      The calibrated verdict must reject truly normal, rounded readings at
      about the rate the combined continuous verdict rejects continuous normal
      data (7.6 %, see NormalityAssessment), where the uncalibrated tests
      reject 18 % (n = 100) to 100 % (n = 1000) at a step of 0.2 sigma.
      Measured with the production 999 draws, 300 samples each (2026-10-21):
      step 0.05 sigma 9.0 % / 7.7 % (n = 100 / 1000); 0.2 sigma 6.3 % / 6.0 %;
      0.5 sigma 4.0 % / 1.0 %. The test runs a cheaper version (60 samples,
      199 draws) and bounds the count: at a true rate of 8 % the chance of 12
      or more rejections in 60 is below 1 %.
    input:
      samples: 60
      n: 200
      step_in_sigma: 0.2
      draws: 199
    expected:
      max_rejections: 11
