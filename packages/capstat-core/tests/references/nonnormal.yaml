# Non-normal capability -- reference values and identities
#
# ---------------------------------------------------------------------------
# Why this file leans on identities rather than quoted numbers
# ---------------------------------------------------------------------------
# There is no widely published worked example that pins a Box-Cox capability or
# an ISO 22514 percentile capability end to end. But both methods are bound by
# identities that must hold exactly, and those are stronger tests than a single
# quoted number would be -- they hold for every dataset, not one.
#
#   1. The percentile method must REDUCE to the classic indices on normal data.
#      ISO replaces the 6-sigma span with the P99.865 - P0.135 span. For a
#      normal distribution those percentiles are exactly the +/- 3 sigma points,
#      so the two definitions must coincide. They agree to 7.7e-06 relative --
#      not exactly, because ISO's 0.135 % is a *rounded* percentile: the true
#      +/-3 sigma tail is 0.13498980...%, making the span 5.999954 sigma rather
#      than 6. That residual is a property of the standard's rounding, and the
#      tolerance below encodes it.
#
#   2. Box-Cox and the percentile method agree ONLY at the just-capable point,
#      and this file originally claimed -- wrongly -- that they agree in general.
#      The test caught it. The two compute different quantities:
#
#        Box-Cox     Ppu = (ln(USL) - mu) / (3*sigma)        [linear, log scale]
#        percentile  Ppu = (USL - X50) / (X99.865 - X50)
#                        = (e^U - 1) / (e^(3*sigma) - 1)     [nonlinear, original]
#
#      with U = ln(USL) - mu. Setting U = 3*sigma makes both equal 1: when the
#      limit sits exactly on the 99.865 % percentile, both say "just capable".
#      Away from that point they diverge, and by a lot -- with the limit far out
#      in the tail we measure Box-Cox Ppu = 1.61 against percentile Ppu = 2.44 on
#      the same data. Neither is wrong; they answer different questions. They are
#      NOT interchangeable, and a user comparing them must know that.
#
#   3. Box-Cox is strictly increasing for every lambda (its derivative is
#      x^(lambda-1) > 0 for x > 0), so it preserves the order of the
#      specification limits. Verified for lambda in {-2, -0.5, 0, 0.5, 1, 3}.
#
#   4. Fitting is maximum-likelihood, so a fitted normal carries the MLE sigma
#      (denominator n), while the classic indices use the sample sigma
#      (denominator n-1). The percentile method therefore differs from the
#      classic indices by exactly the factor sqrt(n/(n-1)) even on perfectly
#      normal data: 1.3e-04 relative at n = 4000. This is a real, understood
#      O(1/n) offset, not an implementation error, and it vanishes as n grows.
#
# The transformation itself is scipy's (stats.boxcox, MLE for lambda); the
# lambda recovery case below checks that we drive it correctly, not that scipy
# is correct.

sources:
  box_cox:
    title: >
      Box, G. E. P., & Cox, D. R. (1964). An analysis of transformations.
      Journal of the Royal Statistical Society, Series B, 26(2), 211-252.
    implementation: scipy.stats.boxcox (maximum-likelihood lambda)
    note: >
      NIST/SEMATECH e-Handbook, section 6.5.2, describes the same transformation
      for capability work.
  percentile_method:
    title: >
      ISO 22514-4, Statistical methods in process management -- Capability and
      performance -- Part 4: Process capability estimates and performance
      measures.
    formulas: >
      Pp  = (USL - LSL) / (X_99.865 - X_0.135)
      Ppk = min( (USL - X_50) / (X_99.865 - X_50),
                 (X_50 - LSL) / (X_50 - X_0.135) )
    note: >
      X_p are percentiles of the fitted distribution. The method yields
      performance (long-term) indices only: it uses the overall distribution and
      has no within/between subgroup split, so it cannot produce Cp/Cpk.

cases:
  - id: percentile-percentiles-are-the-three-sigma-points
    method: percentile_method
    description: >
      The 0.135 % and 99.865 % percentiles are the +/- 3 sigma points of a
      normal distribution -- this is where ISO's choice comes from.
    expected:
      lower_percentile: 0.00135
      upper_percentile: 0.99865
      normal_cdf_at_minus_three: 0.001349898
    tolerance:
      abs: 1.0e-6

  - id: percentile-reduces-to-classic-on-normal-data
    method: percentile_method
    description: >
      Given the SAME normal distribution (no refitting), the percentile method
      must reproduce the classic Pp/Ppk. The residual is ISO's rounding of the
      percentile: P99.865 - P0.135 = 5.999954 sigma, not 6 sigma exactly.
    tolerance:
      rel: 5.0e-5

  - id: percentile-fitted-normal-differs-by-the-ddof-factor
    method: percentile_method
    description: >
      When the normal is *fitted* rather than given, scipy returns the
      maximum-likelihood sigma (denominator n) while the classic indices use the
      sample sigma (denominator n-1). The two therefore differ by exactly
      sqrt(n/(n-1)) - 1, which is 1.25e-04 at n = 4000. Pinning this stops the
      offset being mistaken for a bug later, and stops a real bug hiding inside
      a tolerance loose enough to swallow it.
    input:
      n: 4000
    tolerance:
      # Both factors are exact algebra on the same sample (s_{n-1}/s_n is
      # identically sqrt(n/(n-1)); the span is a constant), so this must hold to
      # machine precision. A loose tolerance here would be an admission that we
      # do not actually understand the gap.
      rel: 1.0e-12

  - id: box-cox-recovers-lambda-zero-on-lognormal-data
    method: box_cox
    description: >
      A lognormal variable is exactly normal under a log transform, i.e. under
      Box-Cox with lambda = 0. The MLE must land near zero. It will not be
      exactly zero -- lambda is estimated from a finite sample -- so the
      tolerance reflects sampling error, not implementation error.
    tolerance:
      abs: 0.1

  - id: box-cox-and-percentile-agree-only-when-just-capable
    method: cross_method
    description: >
      With the specification limit placed exactly on the 99.865 % percentile,
      both methods must report an index of 1.0 -- "just capable" is the one
      point where their different definitions coincide (U = 3*sigma). Away from
      it they legitimately diverge; see the note at the top of this file.
    expected:
      index_at_the_just_capable_point: 1.0
    tolerance:
      abs: 0.02
